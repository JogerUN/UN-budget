name: un-budget

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./src/backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: ./src/backend
    restart: unless-stopped
    env_file:
      - ./src/backend/.env
    networks:
      - internal_network
  frontend:
    build: 
      context: ./src/frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - internal_network

volumes:
  postgres_data:

networks:
  internal_network:
    driver: bridge