name: un-budget

services:
  backend:
    build:
      context: ./src/backend
    restart: unless-stopped
    env_file:
      - ./src/backend/.env
    expose:
      - "8000"
    networks:
      - internal_network

  frontend:
    build:
      context: ./src/frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
